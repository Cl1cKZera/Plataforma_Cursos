<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:p="primefaces">

<h:head>
    <title>Plataforma de Educação Financeira</title>
</h:head>

<h:body
    style="background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 30px;">

    <p:panel header="Ambiente Configurado com Sucesso!"
        style="max-width: 700px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
        <div style="padding: 10px 0;">
            <h3 style="color: #2c3e50; margin-top: 0;">Plataforma de Educação Financeira &amp; Chatbot IA</h3>
            <p style="color: #555; line-height: 1.6;">
                Este teste valida que o <strong>Jakarta Server Faces (JSF 4.0)</strong>,
                o <strong>Apache Tomcat 10</strong> e a biblioteca <strong>PrimeFaces 14</strong>
                estão integrados e renderizando corretamente no navegador.
            </p>
        </div>

        <p:divider />

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <p:button value="PrimeFaces Ativo" icon="pi pi-check" styleClass="ui-button-success" />
            <p:button value="Documentação" icon="pi pi-external-link" href="https://www.primefaces.org" target="_blank"
                styleClass="ui-button-outlined" />
        </div>
    </p:panel>

</h:body>

</html>
